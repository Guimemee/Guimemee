name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *' # Executa todo dia à meia-noite (UTC)
  push:
    branches:
      - main
  workflow_dispatch: # Permite execução manual pelo painel de Actions

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate Stats SVG
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: python update_stats.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg
          git diff-index --quiet HEAD || git commit -m "Auto-update GitHub stats card"
          git push
