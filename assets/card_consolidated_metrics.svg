        <g transform="translate(-68, 0)">
            <rect width="136" height="24" rx="4" fill="#818cf8"/>
            <!-- Trophy SVG -->
            <path d="M4 3h12v3a6 6 0 01-5 5.92V14h3a1 1 0 011 1v1H5v-1a1 1 0 011-1h3v-2.08A6 6 0 014 6V3zm-2 2h2v2a4 4 0 01-2-2zm16 0a4 4 0 01-2 2V5h2z" fill="#070d18" transform="translate(10, 4) scale(0.9)"/>
            <text x="32" y="16" class="badge-txt" fill="#070d18">CHALLENGES FIAP</text>
        </g>
        
        <!-- Big Number -->
        <text x="0" y="74" class="num">4</text>
        
        <!-- Subtitles -->
        <text x="0" y="112" class="title">Desafios Corporativos</text>
        <text x="0" y="132" class="sub">HAOC, Natura, Sanofi &amp; SPI</text>
    </g>

