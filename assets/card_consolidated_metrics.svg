        <text x="0" y="74" class="num">9 GS</text>
        
        <!-- Subtitles -->
        <text x="0" y="112" class="title">Soluções Interdisciplinares</text>
        <text x="0" y="132" class="sub">2/ano (2022-2025) • 1 em 2026</text>
