<svg xmlns="http://www.w3.org/2000/svg" width="880" height="205" viewBox="0 0 880 205" fill="none">
    <style>
        .card-bg { fill: #0e121b; stroke: #232938; stroke-width: 1.5; rx: 8px; }
        .divider { stroke: #232938; stroke-width: 1.5; }
        .num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #ffffff; text-anchor: middle; }
        .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; font-weight: 700; fill: #79c0ff; text-anchor: middle; }
        .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #8b949e; text-anchor: middle; }
        .badge-txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; }
    </style>
    
    <rect width="878" height="203" x="1" y="1" class="card-bg"/>

    <!-- Vertical dividers -->
    <line x1="220" y1="1" x2="220" y2="204" class="divider"/>
    <line x1="440" y1="1" x2="440" y2="204" class="divider"/>
    <line x1="660" y1="1" x2="660" y2="204" class="divider"/>

    <!-- ================= COLUMN 1: PBIX PRIVADOS ================= -->
    <g transform="translate(110, 24)">
        <!-- Pill Badge -->
        <g transform="translate(-68, 0)">
            <rect width="136" height="24" rx="4" fill="#eab308"/>
            <!-- Lock SVG -->
            <path d="M5 8V6a3 3 0 016 0v2h1a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1V9a1 1 0 011-1h2zm2-2a1 1 0 012 0v2H7V6zm-1 5a1 1 0 102 0 1 1 0 00-2 0z" fill="#070d18" transform="translate(10, 4) scale(0.9)"/>
            <text x="32" y="16" class="badge-txt" fill="#070d18">PBIX PRIVADOS 🔒</text>
        </g>
        
        <!-- Big Number -->
        <text x="0" y="74" class="num">155+</text>
        
        <!-- Subtitles -->
        <text x="0" y="112" class="title">Modelos Corporativos Internos</text>
        <text x="0" y="132" class="sub">DAX Avançado, SLAs &amp; Custos</text>
    </g>

    <!-- ================= COLUMN 2: SQL DW SCRIPTS ================= -->
    <g transform="translate(330, 24)">
        <!-- Pill Badge -->
        <g transform="translate(-68, 0)">
            <rect width="136" height="24" rx="4" fill="#00f2fe"/>
            <!-- Database SVG -->
            <path d="M2 4c0-1.1 3.58-2 8-2s8 .9 8 2-3.58 2-8 2-8-.9-8-2zm0 4.5c0 1.1 3.58 2 8 2s8-.9 8-2V7c-1.5 1-4.5 1.5-8 1.5S3.5 8 2 7v1.5zm0 5c0 1.1 3.58 2 8 2s8-.9 8-2V12c-1.5 1-4.5 1.5-8 1.5s-6.5-.5-8-1.5v1.5z" fill="#070d18" transform="translate(10, 4) scale(0.9)"/>
            <text x="32" y="16" class="badge-txt" fill="#070d18">SQL DW SCRIPTS</text>
        </g>
        
        <!-- Big Number -->
        <text x="0" y="74" class="num">45</text>
        
        <!-- Subtitles -->
        <text x="0" y="112" class="title">Pipelines &amp; Modelagem</text>
        <text x="0" y="132" class="sub">DDL, Views Analíticas &amp; ETL</text>
    </g>

    <!-- ================= COLUMN 3: CHALLENGES FIAP ================= -->
    <g transform="translate(550, 24)">
