<svg xmlns="http://www.w3.org/2000/svg" width="560" height="235" viewBox="0 0 560 235" fill="none">
    <style>
        .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6px; }
        .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #58a6ff; }
        .section-header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #c9d1d9; }
        .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #c9d1d9; }
        .muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #8b949e; }
        .icon-blue { fill: #58a6ff; }
    </style>
    <rect width="558" height="233" x="1" y="1" class="bg"/>

    <!-- Section 1: Indepth analysis -->
    <g transform="translate(18, 16)">
        <text x="0" y="12" class="section-header">▼ Indepth analysis (clone and analyze repositories)</text>
        
        <g transform="translate(0, 20)">
            <svg viewBox="0 0 16 16" width="14" height="14" class="icon-blue" x="0" y="0">
                <path fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75zm5.03 3.47a.75.75 0 010 1.06L5.31 7l1.47 1.47a.75.75 0 01-1.06 1.06l-2-2a.75.75 0 010-1.06l2-2a.75.75 0 011.06 0zm2.44 0a.75.75 0 000 1.06L10.69 7 9.22 8.47a.75.75 0 001.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0z"/>
            </svg>
            <text x="20" y="11" class="title">2 Languages</text>
        </g>

        <!-- Most used languages -->
        <g transform="translate(0, 48)">
            <text x="140" y="0" class="title" text-anchor="middle" style="font-size: 13.5px;">Most used languages</text>
            <text x="210" y="14" class="muted" text-anchor="middle">estimation from 96.1 kB of code in 106 edited files across commits</text>
            
            <!-- Progress bar -->
            <g transform="translate(0, 22)">
                <rect x="0" y="0" width="340" height="8" rx="4" fill="#3572A5"/>
                <rect x="343" y="0" width="165" height="8" rx="4" fill="#00979D"/>
            </g>

            <!-- Legend -->
            <g transform="translate(0, 40)">
                <circle cx="5" cy="5" r="4" fill="#3572A5"/>
                <text x="15" y="9" class="text">Python</text>
                <text x="75" y="9" class="muted">1.79k lines</text>
                <text x="145" y="9" class="muted">64.1 kB</text>

                <circle cx="260" cy="5" r="4" fill="#00979D"/>
                <text x="270" y="9" class="text">Arduino C++</text>
                <text x="360" y="9" class="muted">1.32k lines</text>
                <text x="430" y="9" class="muted">32.0 kB</text>
            </g>
        </g>
    </g>

    <!-- Section 2: Recently used -->
    <g transform="translate(18, 145)">
        <text x="0" y="12" class="section-header">▼ Recently used (analyze recent activity events)</text>
        
        <g transform="translate(0, 20)">
            <svg viewBox="0 0 16 16" width="14" height="14" class="icon-blue" x="0" y="0">
                <path fill-rule="evenodd" d="M1.5 2.75a.25.25 0 01.25-.25h12.5a.25.25 0 01.25.25v8.5a.25.25 0 01-.25.25h-6.5a.75.75 0 00-.53.22L4.5 14.44v-2.19a.75.75 0 00-.75-.75h-2a.25.25 0 01-.25-.25v-8.5zM1.75 1A1.75 1.75 0 000 2.75v8.5C0 12.216.784 13 1.75 13H3v1.543a1.457 1.457 0 002.487 1.03L8.061 13h6.189A1.75 1.75 0 0016 11.25v-8.5A1.75 1.75 0 0014.25 1H1.75zm5.03 3.47a.75.75 0 010 1.06L5.31 7l1.47 1.47a.75.75 0 01-1.06 1.06l-2-2a.75.75 0 010-1.06l2-2a.75.75 0 011.06 0zm2.44 0a.75.75 0 000 1.06L10.69 7 9.22 8.47a.75.75 0 001.06 1.06l2-2a.75.75 0 000-1.06l-2-2a.75.75 0 00-1.06 0z"/>
            </svg>
            <text x="20" y="11" class="title">2 Languages</text>
        </g>

        <!-- Progress bar -->
        <g transform="translate(0, 40)">
            <g transform="translate(0, 0)">
                <rect x="0" y="0" width="340" height="8" rx="4" fill="#3572A5"/>
                <rect x="343" y="0" width="165" height="8" rx="4" fill="#00979D"/>
            </g>

            <!-- Legend -->
            <g transform="translate(0, 18)">
                <circle cx="5" cy="5" r="4" fill="#3572A5"/>
                <text x="15" y="9" class="text">Python</text>
                <text x="80" y="9" class="muted">64.1 kB</text>
                <text x="145" y="9" class="muted">66.7%</text>

                <circle cx="260" cy="5" r="4" fill="#00979D"/>
                <text x="270" y="9" class="text">Arduino C++</text>
                <text x="360" y="9" class="muted">32.0 kB</text>
                <text x="430" y="9" class="muted">33.3%</text>
            </g>
        </g>
